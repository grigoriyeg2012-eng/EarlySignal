<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarlySignal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ac:#1765ED;--bg:#F3F5F9;--sf:#fff;--tx:#202B40;--mu:#6b7690;--bd:#e3e7ef;--ok:#15803d;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--sf:#181f2e;--tx:#e8ecf5;--mu:#93a0ba;--bd:#283148;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--sf:#181f2e;--tx:#e8ecf5;--mu:#93a0ba;--bd:#283148;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;height:100%}
.rail{width:72px;background:var(--ac);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;flex:none}
.rail .sp{flex:1}
.rb{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#ffffffcc;display:grid;place-items:center;transition:.15s}
.rb:hover{background:#ffffff26;color:#fff}.rb.on{background:#fff;color:var(--ac)}
.rb.logo{background:#fff;color:var(--ac);margin-bottom:10px}
.conv{width:290px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none}
.conv h2{margin:0;font-size:16px}
.ch{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.in{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.tabs{display:flex;gap:4px;padding:8px 16px}
.tab{border:0;background:none;padding:5px 10px;border-radius:8px;color:var(--mu);font-size:13px}
.tab.on{background:var(--bg);color:var(--tx);font-weight:600}
#list{overflow:auto;flex:1;padding:0 8px}
.ci{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px}
.ci:hover{background:var(--bg)}.ci.on{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.ci b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci span{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hd{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--sf);border-bottom:1px solid var(--bd)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.on-dot{color:var(--ok);font-size:12px}
.sm{border:1px solid var(--bd);background:var(--sf);border-radius:9px;padding:6px 10px;font-size:13px}
.sm:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:500}
.ban{background:color-mix(in srgb,var(--wn) 14%,transparent);color:var(--wn);padding:6px 18px;font-size:12px}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:min(620px,85%);padding:10px 14px;border-radius:14px;white-space:pre-wrap}
.m.a{background:var(--sf);border:1px solid var(--bd);align-self:flex-start}
.m.u{background:var(--ac);color:#fff;align-self:flex-end}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:500}
td input{width:90px;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
.comp{display:flex;gap:8px;padding:12px 18px;background:var(--sf);border-top:1px solid var(--bd);align-items:flex-end}
.comp textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);display:grid;place-items:center}
.ib.p{background:var(--ac);border-color:var(--ac);color:#fff}
.page{flex:1;overflow:auto;padding:24px;max-width:960px}
.page h1{margin:0 0 4px;font-size:22px}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.big{font-size:26px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-right:6px}
.tag.w{color:var(--wn)}.tag.k{color:var(--ac)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;margin-right:6px}.sw.on{border-color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chart{overflow-x:auto}
.mob{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ac);color:var(--ac);background:var(--sf);border-radius:99px;padding:6px 12px;font-size:13px}.chip:hover{background:var(--ac);color:#fff}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 50px #0006}
body{transition:background-color .25s,color .25s}
button,.ci,.sw,.chip{transition:transform .18s ease,background-color .18s,border-color .18s,box-shadow .18s,color .18s}
button:hover:not(:disabled){transform:scale(1.06)}
button:active:not(:disabled){transform:scale(.96)}
.ci:hover{transform:scale(1.02)}
.rb:hover{transform:scale(1.14)}
.pri:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.card{transition:transform .2s ease,box-shadow .2s ease}
.page .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0000001f}
.in,textarea{transition:border-color .18s,box-shadow .18s}
.in:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button:hover{transform:none!important}}
@media print{:root:root{--bg:#fff;--sf:#fff;--tx:#000;--mu:#444;--bd:#ccc;color-scheme:light}html,body,.app{height:auto!important;display:block!important;overflow:visible!important;background:#fff}.rail,.conv,.noprint,.ov{display:none!important}.page{overflow:visible!important;max-width:none;padding:0}.card{break-inside:avoid;box-shadow:none!important;transform:none!important}}
@media(max-width:1000px){.conv{position:fixed;left:72px;top:0;bottom:0;z-index:20;transform:translateX(-120%);transition:.2s;box-shadow:0 8px 30px #0003}.conv.open{transform:none}.mob{display:grid}}
@media(max-width:700px){.app{flex-direction:column-reverse}.rail{width:100%;flex-direction:row;justify-content:space-around;padding:6px}.rail .sp,.rb.logo{display:none}.conv{left:0;bottom:60px}.page{padding:16px}.m{max-width:92%}}
</style></head><body>
<div class="app" id="app"></div>
<input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.csv" hidden>

en:{greet:'Hello! I can help you understand your health information. Attach a lab CSV, or describe how you feel. I don’t diagnose or recommend treatment.',urgent:'Some of what you describe may need urgent assessment. Please contact your local emergency number (112 in Estonia and across the EU) or go to the nearest emergency department now. I can’t assess emergencies, and this chat should not delay care.',labs:'To go through lab results, attach a CSV with columns: indicator, value, unit, low, high, date. You’ll review and correct every value before anything is saved. PDFs and images need an OCR service, which isn’t connected in this prototype.',symp:'Thanks for sharing. To organise this for a doctor, could you tell me:\n• When did it start, and has it changed since?\n• How severe is it, and what makes it better or worse?\n• Any other symptoms, medicines, or relevant medical history?\n\nI can’t diagnose. I can help you prepare a clear summary and questions for a healthcare professional.',typing:'EarlySignal AI is typing…',none:'No conversations here.',newconv:'New conversation',newb:'New',sc:'Search conversations',all:'All',active:'Active',archived:'Archived',online:'Online',sm:'Search in chat',save:'Save',ren:'Rename',arc:'Archive',unarc:'Unarchive',del:'Delete',cdel:'Confirm delete',ban:'Prototype · rule-based demo responder. No LLM, OCR or database is connected. Not medical advice.',chat:'Chat',unsup:'Unsupported file type. Please attach PDF, PNG, JPG or CSV.',big:'That file is larger than the 10 MB limit.',att:'Attached',ocr:'I saved the file’s details, but reading PDFs and images needs the OCR service, which isn’t connected in this prototype. Nothing was extracted. For now, attach a CSV (indicator, value, unit, low, high, date).',nop:'I couldn’t find the expected columns (indicator, value, unit). Please check the header row.',ext:n=>`I extracted ${n} rows. Please review and correct them below before I save anything.`,saved:(n,b)=>`Saved ${n} confirmed result(s)`+ ru:{greet:'Здравствуйте! Я помогу разобраться в вашей медицинской информации. Прикрепите CSV с анализами или опишите, как вы себя чувствуете. Я не ставлю диагнозы и не назначаю лечение.',urgent:'То, что вы описываете, может требовать срочной оценки врачом. Пожалуйста, позвоните на местный номер экстренных служб (112 в Эстонии и странах ЕС) или обратитесь в ближайшее отделение неотложной помощи прямо сейчас. Я не могу оценивать экстренные состояния, и этот чат не должен задерживать помощь.',labs:'Чтобы разобрать результаты анализов, прикрепите CSV со столбцами: indicator, value, unit, low, high, date. Вы проверите и поправите каждое значение до сохранения. Для PDF и изображений нужен сервис OCR, который в этом прототипе не подключён.',symp:'Спасибо, что рассказали. Чтобы упорядочить это для врача, уточните, пожалуйста:\n• Когда это началось и как менялось с тех пор?\n• Насколько это выражено, что усиливает или облегчает?\n• Есть ли другие симптомы, принимаемые лекарства или важная медицинская история?\n\nЯ не ставлю диагнозы. Я могу помочь подготовить краткое резюме и вопросы для врача.',typing:'EarlySignal AI печатает…',none:'Здесь нет диалогов.',newconv:'Новый диалог',newb:'Новый',sc:'Поиск диалогов',all:'Все',active:'Активные',archived:'Архив',online:'В сети',sm:'Поиск в чате',save:'Сохранить',ren:'Переименовать',arc:'В архив',unarc:'Из архива',del:'Удалить',cdel:'Подтвердить удаление',ban:'Прототип · демо-ответчик на правилах. LLM, OCR и база данных не подключены. Не медицинская рекомендация.',chat:'Чат',unsup:'Неподдерживаемый тип файла. Прикрепите PDF, PNG, JPG или CSV.',big:'Файл больше лимита в 10 МБ.',att:'Прикреплено',ocr:'Я сохранил сведения о файле, но для чтения PDF и изображений нужен сервис OCR, который в этом прототипе не подключён. Ничего не извлечено. Пока прикрепите CSV (indicator, value, unit, low, high, date).',nop:'Не нашёл нужные столбцы (indicator, value, unit). Проверьте строку заголовков.',ext:n=>`Я извлёк строк: ${n}. Пожалуйста, проверьте switch(a){
case'nav':S.view=v;S.open=false;break;
case'newc':newConv();S.view='chat';S.q='';S.filter='all';S.open=false;break;
case'sel':S.cur=v;S.view='chat';S.open=false;S.mq='';break;
case'filt':S.filter=v;break;
case'drawer':S.open=!S.open;break;
case'ren':if(S.ren){const i=document.getElementById('rn');if(i&&i.value.trim())cur().title=i.value.trim()}S.ren=!S.ren;break;
case'arc':cur().archived=!cur().archived;if(cur().archived){const n=S.convs.find(c=>!c.archived);if(n)S.cur=n.id;else{newConv()}}else S.filter='all';break;
case'del':if(!S.del){S.del=true;break}S.convs=S.convs.filter(c=>c.id!==S.cur);if(!S.convs.length)newConv();else S.cur=(S.convs.find(c=>!c.archived)||S.convs[0]).id;S.del=false;break;
case'cyes':S.consent='yes';break;
case'cno':S.consent='no';break;
case'cons':S.consent=S.consent==='yes'?'no':'yes';break;
case'print':try{window.print()}catch(_){}return;
case'sug':{const ta=document.getElementById('ta');ta.value=v;return send()}
case'send':return send();
case'attach':case'attach2':document.getElementById('file').click();return;
case'confirm':return confirmRows();
case'cancel':S.pending=null;break;
case'theme':S.set.theme=v;break;
case'accent':S.set.accent=v;break;
case'exp':S.exp=!S.exp;break;
case'rmdoc':S.docs=S.docs.filter(d=>d.id!==v);break;
case'addrem':{const t=document.getElementById('rt').value.trim(),d=document.getElementById('rd').value;if(!t)return;S.rem.push({t,d:d||'no date'});break}
case'rmrem':S.rem.splice(+v,1);break;
case'demo':{const vals=[['2026-08-01',0.9],['2026-09-15',1.0],['2026-10-20',1.1]];vals.forEach(x=>S.hist.push({ind:'Creatinine (synthetic)',val:String(x[1]),unit:'mg/dL',lo:'0.6',hi:'1.2',date:x[0],src:'Synthetic demo data',confirmed:true}));break}
case'reset':if(!S.del){S.del=true;break}S.hist=[];S.docs=[];S.rem=[];S.asm=null;S.convs=[];newConv();S.del=false;break;
}
render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',ev=>{const t=ev.target;
if(t.id==='cq'){S.q=t.value;document.getElementById('list').innerHTML=listHTML()}
if(t.id==='mq'){S.mq=t.value;document.getElementById('msgs').innerHTML=msgsHTML()}
if(t.id==='dq'){S.dq=t.value;const p=t.selectionStart;render();const n=document.getElementById('dq');n.focus();n.setSelectionRange(p,p)}
if(t.id==='prev'){AS().prev=t.value;save()}
if(t.id==='ta'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'}});
document.addEventListener('change',ev=>{const t=ev.target;
if(t.dataset&&t.dataset.g){const a=AS();if(t.dataset.g==='age'){a.age=t.value;save();render();return}const arr=a[t.dataset.g];const i=arr.indexOf(t.dataset.v);if(t.checked&&i<0)arr.push(t.dataset.v);if(!t.checked&&i>=0)arr.splice(i,1);save();return}
if(t.id==='indsel'){S.ind=t.value;render()}
if(t.id==='from'){S.from=t.value;render()}
if(t.id==='lang'){S.set.lang=t.value;render()}
if(t.id==='detail'){S.set.detail=t.value;save()}
if(t.id==='file'){const f=t.files[0];t.value='';S.view='chat';render();upload(f)}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='ta'&&ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send()}
if(ev.target.id==='rn'&&ev.key==='Enter')act('ren')});
render();
</script></body></html>
